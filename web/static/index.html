<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Q&A Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="toolbar">
  <button id="listenBtn" class="primary" disabled>● Start listening</button>
  <select id="sourceSelect" title="Where the questions come from">
    <option value="call">Call audio (share tab / screen)</option>
    <option value="room">Room mic</option>
  </select>
  <label class="small muted" title="Only send audio while someone is speaking (lower cost)">
    <input id="gateToggle" type="checkbox" checked> skip silence
  </label>
  <button id="clearFeedBtn">Clear feed</button>
  <span id="status" class="status">connecting…</span>
</header>

<section class="transcript">
  <span class="label">Live transcript:</span>
  <span id="transcript" class="muted">(not listening)</span>
  <span id="transcriptTag" class="tag" hidden></span>
</section>

<main class="layout">
  <aside class="context-panel">
    <h2>Context</h2>
    <ul id="docList" class="doc-list"></ul>
    <div id="contextInfo" class="muted small">No context loaded.</div>
    <label class="file-btn">Upload files<input id="contextFile" type="file" accept=".txt,.md,.pdf,.docx" multiple hidden></label>
    <input id="contextName" type="text" placeholder="Name for pasted text (optional)" autocomplete="off">
    <textarea id="contextText" placeholder="Paste reference text: notes, a job description, a policy…"></textarea>
    <div class="row">
      <button id="addTextBtn">Add text</button>
      <button id="clearContextBtn">Clear all</button>
    </div>
    <div id="contextWarn" class="warn small" hidden></div>
  </aside>

  <section class="feed-panel">
    <h2>Answer feed</h2>
    <div id="feed" class="feed"></div>
    <form id="askForm" class="ask-form">
      <input id="askInput" type="text" placeholder="Type a question (debug)…" autocomplete="off">
      <label class="small muted"><input id="detectToggle" type="checkbox" checked> via detector</label>
      <button type="submit">Send</button>
    </form>
  </section>
</main>

<script src="/static/gate.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
